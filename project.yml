name: SpotGolf
options:
  bundleIdPrefix: golf.spot
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
settings:
  base:
    # The app's version, shared by the phone app, the watch app, and the Live Activity.
    # SemVer; see Versioning in CLAUDE.md before changing it.
    MARKETING_VERSION: 0.2.0
fileGroups:
  - CLAUDE.md
  - README.md
  - project.yml
  - plans
packages:
  CourseDataSwift:
    url: https://github.com/SpotGolf/CourseDataSwift
    exactVersion: "0.1.3"

schemes:
  SpotGolf:
    build:
      targets:
        SpotGolf: all
        SpotGolfTests: [test]
        SpotGolfUITests: [test]
    test:
      targets:
        - SpotGolfTests
        - SpotGolfUITests

  SpotGolfWatch:
    build:
      targets:
        SpotGolfWatch: all
        SpotGolfWatchTests: [test]
        SpotGolfWatchUITests: [test]
    test:
      targets:
        - SpotGolfWatchTests
        - SpotGolfWatchUITests

targets:
  SpotGolf:
    type: application
    platform: iOS
    sources:
      - path: SpotGolf
      - path: Shared
      - path: LiveActivity
    settings:
      base:
        INFOPLIST_FILE: SpotGolf/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: golf.spot.SpotGolf
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5CRT56YETR
    dependencies:
      - target: SpotGolfWatch
      - target: SpotGolfLiveActivity
      - package: CourseDataSwift
      - sdk: HealthKit.framework
    entitlements:
      path: SpotGolf/SpotGolf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Needed to launch the watch app when a round starts
        com.apple.developer.healthkit: true
    info:
      path: SpotGolf/Info.plist
      properties:
        CFBundleDisplayName: SpotGolf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # iOS needs a bundle version, so it is the same SemVer version
        CFBundleVersion: $(MARKETING_VERSION)
        NSLocationWhenInUseUsageDescription: "SpotGolf needs your location to record where you hit the ball on the course."
        NSHealthShareUsageDescription: "SpotGolf uses HealthKit to start your round on Apple Watch."
        NSHealthUpdateUsageDescription: "SpotGolf uses HealthKit to start your round on Apple Watch."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SpotGolf needs your location to record where you hit the ball on the course."
        # Asked for on the phone; the watch app's swing detection uses the same permission
        NSMotionUsageDescription: "SpotGolf uses wrist motion on your Apple Watch to detect your swings."
        # Shows the current hole on the Lock Screen during a round
        NSSupportsLiveActivities: true
        # Keeps the yards and hole changes going with the phone locked during a round
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UILaunchScreen:
          UIColorName: ""

  SpotGolfLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: SpotGolfLiveActivity
      - path: LiveActivity
    settings:
      base:
        INFOPLIST_FILE: SpotGolfLiveActivity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: golf.spot.SpotGolf.LiveActivity
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5CRT56YETR
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: SpotGolfLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: SpotGolf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # iOS needs a bundle version, so it is the same SemVer version
        CFBundleVersion: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SpotGolfWatch:
    type: application
    platform: watchOS
    sources:
      - path: SpotGolfWatch
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SpotGolfWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: golf.spot.SpotGolf.watchkitapp
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5CRT56YETR
    entitlements:
      path: SpotGolfWatch/SpotGolfWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: SpotGolfWatch/Info.plist
      properties:
        CFBundleDisplayName: SpotGolf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # iOS needs a bundle version, so it is the same SemVer version
        CFBundleVersion: $(MARKETING_VERSION)
        NSHealthShareUsageDescription: "SpotGolf uses HealthKit to keep the app active during your round."
        NSHealthUpdateUsageDescription: "SpotGolf uses HealthKit to keep the app active during your round."
        NSLocationWhenInUseUsageDescription: "SpotGolf needs your location to record where you hit the ball on the course."
        NSMotionUsageDescription: "SpotGolf uses wrist motion to detect your swings."
        WKBackgroundModes:
          - workout-processing
        UIBackgroundModes:
          - location
        WKApplication: true
        WKCompanionAppBundleIdentifier: golf.spot.SpotGolf
        WKWatchOnly: false
    dependencies:
      - sdk: WatchConnectivity.framework
      - sdk: HealthKit.framework
      - package: CourseDataSwift

  SpotGolfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpotGolfTests
      - path: Shared
      # The apps' logic, built here like Shared so it takes the test target's copies of the
      # Shared types. The sync tests run the phone's and the watch's sides together.
      - path: SpotGolf/Import
      - path: SpotGolf/Models
      - path: SpotGolf/Services
      - path: SpotGolf/Sync
      - path: SpotGolf/Utilities
      - path: LiveActivity
      - path: SpotGolfWatch/Sync
      - path: TestFixtures/Broadlands-Golf-Course.json.gz
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpotGolf
      - package: CourseDataSwift

  SpotGolfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpotGolfUITests
      - path: TestHelpers
      - path: TestFixtures/test-locations.csv
        buildPhase: resources
      - path: TestFixtures/test-locations-penalties.csv
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpotGolf
    dependencies:
      - target: SpotGolf

  SpotGolfWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: SpotGolfWatchTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpotGolfWatch
      - package: CourseDataSwift

  SpotGolfWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: SpotGolfWatchUITests
      - path: TestHelpers
      - path: TestFixtures/test-locations.csv
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpotGolfWatch
    dependencies:
      - target: SpotGolfWatch
