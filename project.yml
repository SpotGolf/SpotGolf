name: SpotGolf
options:
  bundleIdPrefix: com.pontarelli
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"

schemes:
  SpotGolf:
    build:
      targets:
        SpotGolf: all
        SpotGolfTests: [test]
        SpotGolfUITests: [test]
    test:
      targets:
        - SpotGolfTests
        - SpotGolfUITests

  SpotGolfWatch:
    build:
      targets:
        SpotGolfWatch: all
        SpotGolfWatchUITests: [test]
    test:
      targets:
        - SpotGolfWatchUITests

targets:
  SpotGolf:
    type: application
    platform: iOS
    sources:
      - path: SpotGolf
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SpotGolf/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pontarelli.SpotGolf
        SWIFT_VERSION: "5.9"
    entitlements:
      path: SpotGolf/SpotGolf.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: SpotGolf/Info.plist
      properties:
        CFBundleDisplayName: SpotGolf
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocationWhenInUseUsageDescription: "SpotGolf needs your location to mark where your ball is on the course."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SpotGolf needs your location to mark where your ball is on the course."
        UILaunchScreen:
          UIColorName: ""

  SpotGolfWatch:
    type: application
    platform: watchOS
    sources:
      - path: SpotGolfWatch
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SpotGolfWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pontarelli.SpotGolf.watchkitapp
        SWIFT_VERSION: "5.9"
    info:
      path: SpotGolfWatch/Info.plist
      properties:
        CFBundleDisplayName: SpotGolf
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocationWhenInUseUsageDescription: "SpotGolf needs your location to mark where your ball is on the course."
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pontarelli.SpotGolf
        WKWatchOnly: false
    dependencies:
      - sdk: WatchConnectivity.framework

  SpotGolfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpotGolfTests
      - path: Shared
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpotGolf

  SpotGolfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpotGolfUITests
      - path: TestHelpers
      - path: TestFixtures/test-locations.csv
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpotGolf
    dependencies:
      - target: SpotGolf

  SpotGolfWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: SpotGolfWatchUITests
      - path: TestHelpers
      - path: TestFixtures/test-locations.csv
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpotGolfWatch
    dependencies:
      - target: SpotGolfWatch
