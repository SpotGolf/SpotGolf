name: SpotGolf
options:
  bundleIdPrefix: golf.spot
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
fileGroups:
  - CLAUDE.md
  - README.md
  - project.yml
  - plans
packages:
  CourseDataSwift:
    url: https://github.com/SpotGolf/CourseDataSwift
    exactVersion: "0.1.3"

schemes:
  SpotGolf:
    build:
      targets:
        SpotGolf: all
        SpotGolfTests: [test]
        SpotGolfUITests: [test]
    test:
      targets:
        - SpotGolfTests
        - SpotGolfUITests

  SpotGolfWatch:
    build:
      targets:
        SpotGolfWatch: all
        SpotGolfWatchUITests: [test]
    test:
      targets:
        - SpotGolfWatchUITests

targets:
  SpotGolf:
    type: application
    platform: iOS
    sources:
      - path: SpotGolf
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SpotGolf/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: golf.spot.SpotGolf
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5CRT56YETR
    dependencies:
      - target: SpotGolfWatch
      - package: CourseDataSwift
      - sdk: HealthKit.framework
    entitlements:
      path: SpotGolf/SpotGolf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Needed to launch the watch app when a round starts
        com.apple.developer.healthkit: true
    info:
      path: SpotGolf/Info.plist
      properties:
        CFBundleDisplayName: SpotGolf
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocationWhenInUseUsageDescription: "SpotGolf needs your location to record where you hit the ball on the course."
        NSHealthShareUsageDescription: "SpotGolf uses HealthKit to start your round on Apple Watch."
        NSHealthUpdateUsageDescription: "SpotGolf uses HealthKit to start your round on Apple Watch."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SpotGolf needs your location to record where you hit the ball on the course."
        # Asked for on the phone; the watch app's swing detection uses the same permission
        NSMotionUsageDescription: "SpotGolf uses wrist motion on your Apple Watch to detect your swings."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UILaunchScreen:
          UIColorName: ""

  SpotGolfWatch:
    type: application
    platform: watchOS
    sources:
      - path: SpotGolfWatch
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SpotGolfWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: golf.spot.SpotGolf.watchkitapp
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 5CRT56YETR
    entitlements:
      path: SpotGolfWatch/SpotGolfWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: SpotGolfWatch/Info.plist
      properties:
        CFBundleDisplayName: SpotGolf
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHealthShareUsageDescription: "SpotGolf uses HealthKit to keep the app active during your round."
        NSHealthUpdateUsageDescription: "SpotGolf uses HealthKit to keep the app active during your round."
        NSLocationWhenInUseUsageDescription: "SpotGolf needs your location to record where you hit the ball on the course."
        NSMotionUsageDescription: "SpotGolf uses wrist motion to detect your swings."
        WKBackgroundModes:
          - workout-processing
        UIBackgroundModes:
          - location
        WKApplication: true
        WKCompanionAppBundleIdentifier: golf.spot.SpotGolf
        WKWatchOnly: false
    dependencies:
      - sdk: WatchConnectivity.framework
      - sdk: HealthKit.framework
      - package: CourseDataSwift

  SpotGolfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpotGolfTests
      - path: Shared
      - path: TestFixtures/Broadlands-Golf-Course.json.gz
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpotGolf
      - package: CourseDataSwift

  SpotGolfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpotGolfUITests
      - path: TestHelpers
      - path: TestFixtures/test-locations.csv
        buildPhase: resources
      - path: TestFixtures/test-locations-penalties.csv
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpotGolf
    dependencies:
      - target: SpotGolf

  SpotGolfWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: SpotGolfWatchUITests
      - path: TestHelpers
      - path: TestFixtures/test-locations.csv
        buildPhase: resources
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpotGolfWatch
    dependencies:
      - target: SpotGolfWatch
